# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: crosswind
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
