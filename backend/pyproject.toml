[project]
name = "crosswind-backend"
version = "1.0.0"
description = "Weather-aware truck routing API"
requires-python = ">=3.12"
dependencies = [
    "django==5.1.15",
    "djangorestframework==3.17.2",
    "django-cors-headers==4.9.0",
    "requests==2.34.2",
    "whitenoise==6.12.0",
    "gunicorn==26.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
]

[tool.uv]
package = false
